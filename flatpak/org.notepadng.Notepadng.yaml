id: org.notepadng.Notepadng
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: notepadng
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: libqscintilla
    buildsystem: simple
    build-commands:
      - qmake src/qscintilla.pro
      - make -j $FLATPAK_BUILDER_N_JOBS
      - INSTALL_ROOT=./prefix make install
      - mv ./prefix/usr/lib/x86_64-linux-gnu/* ./prefix/usr/lib && rm -r ./prefix/usr/lib/x86_64-linux-gnu
      - cp -r ./prefix/usr/* /app
    cleanup:
      - "/include"
      - "/mkspecs"
      - "/qsci"
    sources:
      - type: archive
        url: https://www.riverbankcomputing.com/static/Downloads/QScintilla/2.14.1/QScintilla_src-2.14.1.tar.gz
        sha256: dfe13c6acc9d85dfcba76ccc8061e71a223957a6c02f3c343b30a9d43a4cdd4d

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_BINARY=OFF
      - -DBUILD_STATIC=OFF
    cleanup:
      - "/include"
      - "/lib/cmake"
      - "/lib/pkgconfig"
      - "/share/man"
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: notepadng
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    cleanup:
      - "/share/man"
    sources:
      - type: dir
        path: ..
